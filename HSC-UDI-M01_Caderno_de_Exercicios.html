:root{
  --navy:#011072; --blue:#4A6CF7; --ink:#06091F; --soft:#F0F2FF; --gray:#6E7480; --line:#D8DCE3;
  --blue-10:rgba(74,108,247,.10); --blue-20:rgba(74,108,247,.20); --navy-06:rgba(1,16,114,.06);
  --paper:#FFFFFF; --bg:#F5F6FB; --text:#141833;
  --r:18px; --shadow:0 1px 2px rgba(6,9,31,.04),0 8px 28px rgba(6,9,31,.07);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:"Blauer Nue",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;line-height:1.55}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
a{color:var(--blue)}

/* ---------- progress line on top ---------- */
.topline{position:fixed;inset:0 0 auto 0;height:3px;background:transparent;z-index:60}
.topline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),#8FA6FF);transition:width .6s var(--ease)}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(160deg,#011072 0%,#050D3D 30%,#0A0E2A 60%,#030842 100%);isolation:isolate}
.hero .photo{position:absolute;inset:0 0 0 38%;background:var(--hero) center/cover no-repeat;opacity:.55;mix-blend-mode:luminosity;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 45%);mask-image:linear-gradient(90deg,transparent 0%,#000 45%);z-index:-2}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(900px 420px at 85% 10%,rgba(74,108,247,.35),transparent 60%),radial-gradient(600px 300px at 0% 100%,rgba(74,108,247,.18),transparent 70%);z-index:-1}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);mask-image:linear-gradient(180deg,#000,transparent 85%);z-index:-1}
.hero-in{max-width:1240px;margin:0 auto;padding:28px 32px 40px;position:relative}
.brandbar{display:flex;align-items:center;gap:16px}
.brandbar img{height:22px}
.brandbar .sep{width:1px;height:20px;background:rgba(255,255,255,.3)}
.brandbar .acad{font-size:12px;letter-spacing:.32em;font-weight:500;opacity:.9}
.brandbar .tag{margin-left:auto;white-space:nowrap;font-size:10.5px;letter-spacing:.18em;font-weight:600;padding:7px 12px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.06);backdrop-filter:blur(6px)}
.hero-grid{display:grid;grid-template-columns:1fr auto;gap:32px;align-items:end;margin-top:54px}
.bignum{position:absolute;right:250px;top:40px;font-size:300px;line-height:.8;font-weight:700;color:transparent;-webkit-text-stroke:1.5px rgba(143,166,255,.28);letter-spacing:-.04em;pointer-events:none;user-select:none}
.eyebrow{font-size:11.5px;letter-spacing:.3em;font-weight:600;color:#9DB0FF;text-transform:uppercase;display:flex;gap:10px;align-items:center}
.eyebrow b{width:26px;height:1px;background:#9DB0FF;display:inline-block}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.02;font-weight:700;letter-spacing:-.02em;margin:14px 0 10px}
.hero h1 span{display:block;font-weight:300;color:#C9D3FF;font-size:.52em;letter-spacing:-.005em;margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(8px)}
.chip svg{width:15px;height:15px;opacity:.85}
.hero-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;gap:9px;padding:13px 20px;border-radius:12px;font-weight:600;font-size:14px;transition:transform .2s var(--ease),box-shadow .2s,background .2s}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:0 8px 24px rgba(74,108,247,.45)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 30px rgba(74,108,247,.55)}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.22)}
.btn-ghost:hover{background:rgba(255,255,255,.14)}
.seals{display:flex;gap:12px;align-items:center;margin-left:8px}
.seals img{height:44px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.3))}

.ringcard{width:220px;padding:20px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.15);backdrop-filter:blur(14px);text-align:center}
.ring{position:relative;width:132px;height:132px;margin:0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:rgba(255,255,255,.12)}
.ring .val{stroke:url(#gr);stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring .lbl{position:absolute;inset:0;display:grid;place-content:center}
.ring .lbl b{font-size:34px;font-weight:700;line-height:1}
.ring .lbl small{font-size:11px;color:#B8C4FF;letter-spacing:.12em;margin-top:4px}
.ringcard p{font-size:12.5px;color:#C9D3FF;margin-top:12px;line-height:1.4}

/* ---------- LAYOUT ---------- */
.wrap{max-width:1240px;margin:-26px auto 0;padding:0 32px 60px;display:grid;grid-template-columns:290px 1fr;gap:28px;position:relative;z-index:2}
aside{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);overflow:auto;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 12px 14px;scrollbar-width:thin}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:2px 10px 12px;border-bottom:1px solid var(--line);margin-bottom:8px}
.side-h span{font-size:11px;letter-spacing:.24em;font-weight:600;color:var(--blue)}
.side-h em{font-style:normal;font-size:12px;color:var(--gray)}
.nav-home{display:flex;align-items:center;gap:10px;width:100%;padding:10px;border-radius:12px;font-size:14px;font-weight:600;color:var(--navy);text-align:left}
.nav-home svg{width:18px;height:18px}
.grp{margin-top:10px}
.grp-h{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:10.5px;letter-spacing:.2em;font-weight:600;color:var(--gray);text-transform:uppercase}
.grp-h .bar{flex:1;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-left:4px}
.grp-h .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .5s var(--ease)}
.it{display:flex;align-items:flex-start;gap:11px;width:100%;padding:8px 10px;border-radius:12px;text-align:left;font-size:13.5px;line-height:1.3;color:#2A2F4A;transition:background .2s}
.it:hover,.nav-home:hover{background:var(--soft)}
.it .st{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--navy);background:var(--soft);position:relative;margin-top:-3px}
.it .st svg{position:absolute;inset:0;transform:rotate(-90deg)}
.it .st svg circle{fill:none;stroke-width:2.5}
.it .st .bgc{stroke:transparent}.it .st .fgc{stroke:var(--blue);stroke-linecap:round;transition:stroke-dashoffset .5s var(--ease)}
.it.done .st{background:var(--blue);color:#fff}
.it.on,.nav-home.on{background:var(--navy);color:#fff}
.it.on .st{background:rgba(255,255,255,.15);color:#fff}
.it.on.done .st{background:var(--blue)}

main{min-width:0}
.view{animation:in .5s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.card{background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:38px 44px}

/* ---------- HOME / MAPA ---------- */
.home-intro{display:grid;grid-template-columns:1.4fr 1fr;gap:28px;align-items:start}
.k{font-size:11px;letter-spacing:.26em;font-weight:600;color:var(--blue);text-transform:uppercase}
.h2{font-size:30px;font-weight:700;color:var(--navy);letter-spacing:-.015em;line-height:1.15;margin:8px 0 14px}
.lead{font-size:15.5px;color:#30354F}
.lead + .lead{margin-top:10px}
.docs{display:flex;flex-direction:column;gap:10px}
.doc{display:flex;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:inherit;transition:border-color .2s,transform .2s var(--ease),box-shadow .2s}
.doc:hover{border-color:var(--blue);transform:translateY(-1px);box-shadow:0 6px 18px rgba(74,108,247,.12)}
.doc .ic{width:40px;height:40px;border-radius:10px;background:var(--soft);display:grid;place-items:center;color:var(--navy);flex:none}
.doc .ic svg{width:20px;height:20px}
.doc b{display:block;font-size:14px;color:var(--navy)}
.doc small{font-size:12px;color:var(--gray)}
.doc .go{margin-left:auto;color:var(--blue)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:30px 0 8px}
.stat{padding:16px 18px;border-radius:14px;background:var(--soft)}
.stat b{display:block;font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.stat span{font-size:12px;color:var(--gray)}
.modebar{display:flex;height:10px;border-radius:10px;overflow:hidden;margin:18px 0 8px;background:var(--line)}
.modebar i{display:block;height:100%}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;color:var(--gray)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.timeline{margin-top:34px;display:flex;flex-direction:column;gap:26px}
.tl-blk{display:grid;grid-template-columns:150px 1fr;gap:22px}
.tl-blk .lab{position:relative;padding-top:4px}
.tl-blk .lab b{display:block;font-size:44px;font-weight:700;color:var(--soft);-webkit-text-stroke:1px #B9C5FB;line-height:.9}
.tl-blk .lab span{display:block;font-size:12px;letter-spacing:.2em;font-weight:600;color:var(--navy);margin-top:8px;text-transform:uppercase}
.tl-blk .lab em{font-style:normal;font-size:12px;color:var(--gray)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{position:relative;text-align:left;padding:16px 16px 14px;border-radius:14px;border:1px solid var(--line);background:#fff;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s;overflow:hidden;min-height:128px;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 12px 26px rgba(1,16,114,.12)}
.tile .n{font-size:12px;font-weight:700;color:var(--blue);letter-spacing:.08em}
.tile .t{font-size:14.5px;font-weight:600;color:var(--navy);line-height:1.3;margin:6px 0 12px}
.tile .m{margin-top:auto;display:flex;gap:10px;align-items:center;font-size:12px;color:var(--gray)}
.tile .m svg{width:15px;height:15px}
.tile .ok{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:none;place-items:center}
.tile .ok svg{width:12px;height:12px}
.tile.done .ok{display:grid}
.tile .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--blue);transition:width .5s var(--ease)}
.tile.quiz{background:linear-gradient(150deg,var(--navy),#1B2A9A);border-color:transparent}
.tile.quiz .t{color:#fff}.tile.quiz .n{color:#9DB0FF}.tile.quiz .m{color:#C9D3FF}
.legal{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);font-size:11.5px;color:var(--gray)}

/* ---------- EXERCISE ---------- */
.ex-head{position:relative;overflow:hidden;border-radius:var(--r) var(--r) 0 0;padding:34px 44px 28px;background:linear-gradient(135deg,#fff 0%,#fff 55%,var(--soft) 100%);border-bottom:1px solid var(--line)}
.ex-head .wm{position:absolute;right:28px;top:-14px;font-size:170px;font-weight:700;line-height:1;color:transparent;-webkit-text-stroke:1.5px #CDD6FF;letter-spacing:-.04em;user-select:none}
.ex-head .k{display:flex;gap:10px;align-items:center}
.ex-head .k i{font-style:normal;padding:4px 9px;border-radius:6px;background:var(--navy);color:#fff;letter-spacing:.1em}
.ex-head h2{font-size:32px;font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.12;margin:12px 0 18px;max-width:640px;position:relative}
.pills{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);color:#30354F}
.pill svg{width:15px;height:15px;color:var(--blue)}
.pill.timer{border-color:var(--blue);color:var(--navy);font-weight:600;font-variant-numeric:tabular-nums}
.pill.timer:hover{background:var(--soft)}
.pill.timer.run{background:var(--navy);color:#fff;border-color:var(--navy)}
.pill.timer.run svg{color:#9DB0FF}
.ex-body{padding:30px 44px 36px}
.objective{display:flex;gap:16px;padding:18px 20px;border-radius:14px;background:var(--soft);border-left:4px solid var(--blue);margin-bottom:28px}
.objective svg{width:28px;height:28px;flex:none;color:var(--blue)}
.objective small{display:block;font-size:10.5px;letter-spacing:.22em;font-weight:600;color:var(--blue);margin-bottom:3px}
.objective p{font-size:15.5px;color:var(--navy);font-weight:500;line-height:1.45}

.case{position:relative;border:1px solid var(--line);border-radius:16px;padding:26px 26px 22px;background:
  linear-gradient(#fff,#fff) padding-box;margin-bottom:34px;box-shadow:0 1px 0 #fff inset}
.case::before{content:"";position:absolute;inset:0;border-radius:16px;background:repeating-linear-gradient(180deg,transparent 0 31px,rgba(1,16,114,.035) 31px 32px);pointer-events:none}
.case .tab{position:absolute;top:-12px;left:22px;display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;background:var(--navy);color:#fff;font-size:10.5px;letter-spacing:.2em;font-weight:600}
.case .tab svg{width:13px;height:13px}
.case .stamp{position:absolute;top:-11px;right:22px;background:#fff;font-size:10px;letter-spacing:.24em;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);padding:4px 8px;border-radius:6px;transform:rotate(3deg);opacity:.65}
.case p{font-size:15px;color:#262B45;position:relative;margin-top:10px;max-width:92%}
.case p:first-of-type{margin-top:6px}
.case .tbl{margin-top:16px;position:relative}
table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
table.t th{font-size:10.5px;letter-spacing:.16em;font-weight:600;text-align:left;color:var(--navy);background:var(--soft);padding:10px 14px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 14px;border-bottom:1px solid #EEF0F5;vertical-align:top;color:#30354F}
table.t tr:last-child td{border-bottom:0}
table.t td:first-child{font-weight:700;color:var(--blue);white-space:nowrap;width:1%}

.qs-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.qs-h h3{font-size:12px;letter-spacing:.24em;font-weight:600;color:var(--gray);text-transform:uppercase}
.qs-h span{font-size:12.5px;color:var(--gray)}
.q{position:relative;padding:20px 22px 18px 74px;border:1px solid var(--line);border-radius:16px;margin-bottom:14px;transition:border-color .25s,box-shadow .25s;background:#fff}
.q:focus-within{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-10)}
.q .num{position:absolute;left:20px;top:18px;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--navy);background:var(--soft);transition:background .3s,color .3s}
.q.filled .num{background:var(--blue);color:#fff}
.q label{display:block;font-size:15.5px;font-weight:600;color:var(--navy);line-height:1.4;margin-bottom:12px}
.q textarea{width:100%;min-height:92px;resize:none;overflow:hidden;font:inherit;font-size:15px;line-height:28px;color:var(--text);padding:6px 2px 4px;border:0;outline:0;background:repeating-linear-gradient(180deg,transparent 0 27px,#E3E7F2 27px 28px);background-attachment:local}
.q textarea::placeholder{color:#A4AABB}
.q .meta{display:flex;justify-content:flex-end;gap:12px;font-size:11.5px;color:#A4AABB;margin-top:6px}
.q .meta .sv{color:var(--blue);opacity:0;transition:opacity .3s}
.q .meta .sv.show{opacity:1}
.q .sub{margin:0 0 14px}

.fonte{display:flex;gap:10px;align-items:flex-start;margin-top:24px;padding:14px 16px;border-radius:12px;background:#FAFBFE;border:1px dashed var(--line);font-size:13px;color:var(--gray)}
.fonte svg{width:17px;height:17px;flex:none;color:var(--blue);margin-top:1px}
.fonte b{color:var(--navy);font-weight:600}
.fonte a{text-decoration:none;border-bottom:1px dashed var(--blue)}

.pager{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
.pg-btn{display:flex;flex-direction:column;gap:3px;padding:16px 20px;border-radius:14px;background:var(--paper);box-shadow:var(--shadow);text-align:left;transition:transform .2s var(--ease),box-shadow .2s;border:1px solid transparent}
.pg-btn:hover{transform:translateY(-2px);border-color:var(--blue-20)}
.pg-btn small{font-size:11px;letter-spacing:.18em;color:var(--gray);font-weight:600;display:flex;align-items:center;gap:6px}
.pg-btn small svg{width:13px;height:13px}
.pg-btn b{font-size:15px;color:var(--navy);font-weight:600;line-height:1.3}
.pg-btn.next{text-align:right;align-items:flex-end;background:var(--navy)}
.pg-btn.next small{color:#9DB0FF}.pg-btn.next b{color:#fff}
.pg-btn[hidden]{visibility:hidden;display:flex}

/* ---------- QUIZ ---------- */
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-size:14.5px;color:#30354F;transition:border-color .2s,background .2s,transform .15s}
.opt:hover{border-color:var(--blue);background:#FAFBFF}
.opt .lt{flex:none;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:700;font-size:13px;color:var(--navy);background:var(--soft);transition:.2s}
.opt.sel{border-color:var(--blue);background:var(--blue-10);color:var(--navy);font-weight:500}
.opt.sel .lt{background:var(--blue);color:#fff}
.opt:active{transform:scale(.99)}
.q.quizq{padding-bottom:14px}

/* ---------- FOOTER ---------- */
footer{text-align:center;padding:10px 20px 48px;color:var(--gray);font-size:12px}
footer img{height:20px;margin-bottom:10px;opacity:.9}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:.35s var(--ease);z-index:80;display:flex;gap:10px;align-items:center}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast svg{width:16px;height:16px;color:#8FA6FF}

@media (max-width:980px){
  .wrap{grid-template-columns:1fr;margin-top:-18px;padding:0 16px 40px}
  aside{position:relative;top:0;max-height:none}
  .hero-in{padding:22px 16px 34px}
  .hero-grid{grid-template-columns:1fr}
  .ringcard{width:auto;display:flex;align-items:center;gap:18px;text-align:left}
  .ring{width:96px;height:96px;margin:0}
  .ring .lbl b{font-size:22px}
  .ring .lbl small{display:none}
  .ring{width:84px;height:84px;flex:none}
  .side-h{cursor:pointer;margin-bottom:0;border-bottom:0;padding-bottom:4px}
  .side-h em::after{content:' ▾'}
  aside.closed .grp,aside.closed .nav-home{display:none}
  aside:not(.closed) .side-h{border-bottom:1px solid var(--line);margin-bottom:8px;padding-bottom:12px}
  .bignum{font-size:180px;right:-10px;top:70px}
  .home-intro{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .card,.ex-body{padding:26px 20px}
  .ex-head{padding:26px 20px 22px}
  .ex-head .wm{font-size:110px;right:8px}
  .tl-blk{grid-template-columns:1fr;gap:10px}
  .tl-blk .lab{display:flex;align-items:baseline;gap:12px}
  .tl-blk .lab b{font-size:30px}
  .q{padding:66px 16px 14px 16px}
  .q .num{left:16px;top:16px}
  .pager{grid-template-columns:1fr}
  .seals{margin-left:0}
  .brandbar .sep,.brandbar .acad{display:none}
}
@media print{
  .topline,aside,.pager,.hero-actions,.toast{display:none!important}
  .wrap{display:block;margin:0;padding:0}
  .card{box-shadow:none}
}

.prose h3{font-size:19px;font-weight:700;color:var(--navy);margin:28px 0 8px;letter-spacing:-.01em}

.call::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(143,166,255,.35),transparent 70%)}

.tip{display:flex;gap:14px;margin:18px 0;padding:16px 18px;border-radius:14px;background:var(--soft);border-left:4px solid var(--blue)}
.tip svg{width:22px;height:22px;flex:none;color:var(--blue);margin-top:2px}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:18px 0}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:20px 0}

.flowcap{font-size:12.5px;color:var(--gray);text-align:center;margin-top:-8px}
.aula{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:#FAFBFE;margin-bottom:22px;font-size:13.5px;color:#30354F}

.note{margin:26px 0 6px;border:1px dashed #B9C5FB;border-radius:14px;padding:16px 18px;background:#FCFDFF}

.note textarea{width:100%;min-height:84px;resize:none;overflow:hidden;font:inherit;font-size:15px;line-height:28px;color:var(--text);padding:4px 2px;border:0;outline:0;background:repeating-linear-gradient(180deg,transparent 0 27px,#E3E7F2 27px 28px);background-attachment:local}

const KEY='hsc-'+DOC.code;
let ANS={};try{ANS=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ANS))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* inline: **bold** and [texto](url) */
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<i>$2</i>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
const SEC=DOC.sections;
const GROUPS=[];SEC.forEach((s,i)=>{s.i=i;let g=GROUPS.find(g=>g.k===s.group);if(!g)GROUPS.push(g={k:s.group,name:s.groupName||'',items:[]});g.items.push(s)});
/* inputs per section */
function inputs(s){const k=[];
  (s.qs||[]).forEach((q,i)=>k.push(s.id+'.q'+i));
  const walk=bl=>(bl||[]).forEach((b,i)=>{if(b.note!==undefined)k.push(s.id+'.n'+i);if(b.check)b.check.forEach((c,j)=>k.push(s.id+'.c'+i+'.'+j))});
  walk(s.body);return k}
const filled=k=>{const v=ANS[k];return v!==undefined&&v!==false&&String(v).trim()!==''};
const done=s=>{const k=inputs(s);return k.length?k.filter(filled).length/k.length:(ANS[s.id+'.seen']?1:0)};
const ALLK=SEC.flatMap(inputs);
const totMin=SEC.reduce((a,s)=>a+(s.min||0),0);
const fmtMin=m=>m>=60?Math.floor(m/60)+'h'+(m%60?String(m%60).padStart(2,'0'):''):m+' min';

let cur=-1;
function progress(){
  const a=ALLK.filter(filled).length,t=ALLK.length||1,p=Math.round(a/t*100);
  pct.textContent=p+'%';ringv.style.strokeDashoffset=326.7*(1-a/t);topbar.style.width=p+'%';
  document.getElementById('ring-t').textContent=a+' de '+ALLK.length+' '+(DOC.kind==='caderno'?'respostas preenchidas':'itens preenchidos')+'. Tudo fica salvo neste navegador.';
  const nx=SEC.findIndex(s=>done(s)<1);
  document.getElementById('cta-t').textContent=a===0?'Começar '+(DOC.cta||'pelo ')+SEC[0].short:(nx<0?'Revisar o material':'Continuar '+(DOC.cta2||'no ')+SEC[nx].short);
  renderSide();
}
function ringSvg(f){const c=2*Math.PI*11.5;return '<svg viewBox="0 0 26 26"><circle class="fgc" cx="13" cy="13" r="11.5" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-f))+'"/></svg>'}
function renderSide(){
  let h='<div class="side-h"><span>'+esc(DOC.navLabel)+'</span><em>'+SEC.filter(s=>done(s)===1).length+'/'+SEC.length+'</em></div>';
  h+='<button class="nav-home'+(cur<0?' on':'')+'" data-go="-1">'+IC.home+'Mapa do material</button>';
  GROUPS.forEach(g=>{
    const ks=g.items.flatMap(inputs),a=ks.filter(filled).length;
    h+='<div class="grp"><div class="grp-h">'+esc(g.k)+'<span class="bar"><i style="width:'+(ks.length?a/ks.length*100:0)+'%"></i></span></div>';
    g.items.forEach(s=>{const f=done(s);
      h+='<button class="it'+(s.i===cur?' on':'')+(f===1?' done':'')+'" data-go="'+s.i+'"><span class="st">'+(f===1?IC.check.replace('stroke-width="3"','stroke-width="3" width="12" height="12"'):(f>0?ringSvg(f):'')+esc(s.short))+'</span>'+esc(s.title)+'</button>'});
    h+='</div>'});
  side.innerHTML=h;
}
function tableHtml(rows){let h='<table class="t"><tr>'+rows[0].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';rows.slice(1).forEach(r=>h+='<tr>'+r.map(c=>'<td>'+fmt(c)+'</td>').join('')+'</tr>');return h+'</table>'}
function blocks(s,bl,prefix){return (bl||[]).map((b,i)=>{
  if(b.p!==undefined)return '<p>'+fmt(b.p)+'</p>';
  if(b.h!==undefined)return '<h3>'+fmt(b.h)+'</h3>';
  if(b.list)return '<ul>'+b.list.map(x=>'<li>'+fmt(x)+'</li>').join('')+'</ul>';
  if(b.table)return '<div class="tbl">'+tableHtml(b.table)+'</div>';
  if(b.call)return '<div class="call"><small>'+esc(b.call[0])+'</small><p>'+fmt(b.call[1])+'</p></div>';
  if(b.tip)return '<div class="tip">'+IC.bulb+'<div><small>'+esc(b.tip[0])+'</small><p>'+fmt(b.tip[1])+'</p></div></div>';
  if(b.keys)return '<div class="keys">'+b.keys.map(k=>'<div class="keyc"><b>'+fmt(k[0])+'</b><span>'+fmt(k[1])+'</span></div>').join('')+'</div>';
  if(b.stats)return '<div class="statrow">'+b.stats.map(k=>'<div><b>'+esc(k[0])+'</b><span>'+fmt(k[1])+'</span></div>').join('')+'</div>';
  if(b.flow)return '<div class="flow">'+b.flow.map(k=>'<div><b>'+esc(k[0])+'</b><span>'+esc(k[1])+'</span></div>').join('<i>→</i>')+'</div>'+(b.cap?'<p class="flowcap">'+fmt(b.cap)+'</p>':'');
  if(b.note!==undefined){const k=s.id+'.n'+i;return '<div class="note" data-k="'+k+'"><label>'+IC.pen+esc(b.note||'SUAS ANOTAÇÕES')+'</label><textarea placeholder="Escreva aqui…">'+esc(ANS[k]||'')+'</textarea></div>'}
  if(b.check)return '<div class="checks">'+b.check.map((c,j)=>{const k=s.id+'.c'+i+'.'+j;return '<button class="ck'+(ANS[k]?' on':'')+'" data-ck="'+k+'"><span class="bx">'+IC.check+'</span><span>'+fmt(c)+'</span></button>'}).join('')+'</div>';
  return '';}).join('')}

function home(){
  const d=DOC.home;
  let h='<div class="card view"><div class="home-intro"><div><div class="k">Mapa do material</div><h2 class="h2">'+esc(d.headline)+'</h2>'+d.lead.map(p=>'<p class="lead">'+fmt(p)+'</p>').join('')+'</div>'+
  '<div class="docs"><div class="k" style="margin-bottom:4px">'+esc(d.docsLabel||'Tenha à mão')+'</div>'+d.docs.map(x=>'<a class="doc" href="'+x[2]+'" target="_blank" rel="noopener"><span class="ic">'+IC.book+'</span><span><b>'+esc(x[0])+'</b><small>'+esc(x[1])+'</small></span><span class="go">'+IC.ext+'</span></a>').join('')+'</div></div>';
  h+='<div class="stats">'+d.stats.map(x=>'<div class="stat"><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>').join('')+'</div>';
  if(DOC.kind==='caderno'){const byMode={};SEC.forEach(s=>{if(s.mode&&s.id!=='Q')byMode[s.mode]=(byMode[s.mode]||0)+s.min});const sm=Object.values(byMode).reduce((a,b)=>a+b,0);
    h+='<div class="modebar">'+Object.entries(byMode).map(([m,v])=>'<i style="width:'+(v/sm*100)+'%;background:'+MODE_COLOR[m]+'"></i>').join('')+'</div><div class="legend">'+Object.entries(byMode).map(([m,v])=>'<span><i style="background:'+MODE_COLOR[m]+'"></i>'+m+' · '+v+' min</span>').join('')+'</div>'}
  h+='<div class="timeline">';
  GROUPS.forEach(g=>{const mins=g.items.reduce((a,s)=>a+(s.min||0),0);
    h+='<div class="tl-blk"><div class="lab"><b>'+esc(g.items[0].groupBig||g.k.replace(/\D/g,'')||'·')+'</b><span>'+esc(g.name||g.k)+'</span><em>'+g.items.length+' '+(g.items.length>1?d.unitP:d.unit)+(mins?' · '+fmtMin(mins):'')+'</em></div><div class="tiles">';
    g.items.forEach(s=>{const f=done(s);
      h+='<button class="tile'+(s.id==='Q'?' quiz':'')+(f===1?' done':'')+'" data-go="'+s.i+'"><span class="ok">'+IC.check+'</span><span class="n">'+esc(s.short)+'</span><span class="t">'+esc(s.title)+'</span><span class="m">'+(s.mode?(IC[s.mode]||'')+s.mode+' ':'')+(s.aula?IC.play+esc(s.aula)+' ':'')+(s.min?IC.clock+s.min+' min':'')+'</span><span class="pg" style="width:'+(f*100)+'%"></span></button>'});
    h+='</div></div>'});
  h+='</div><p class="legal">'+fmt(d.legal)+'</p></div>';
  return h;
}
let timer=null,remain=0;
function section(i){
  const s=SEC[i];ANS[s.id+'.seen']=1;save();
  let h='<div class="view"><div class="card" style="padding:0"><div class="ex-head"><div class="wm">'+esc(s.short)+'</div>'+
   '<div class="k"><i>'+esc(s.short)+'</i>'+esc(s.kicker||s.group)+'</div><h2>'+esc(s.title)+'</h2><div class="pills">';
  if(s.mode)h+='<span class="pill">'+(IC[s.mode]||'')+s.mode+'</span>';
  if(s.min&&DOC.kind==='caderno')h+='<button class="pill timer" id="tm">'+IC.clock+'<span>Cronômetro '+s.min+':00</span></button>';
  else if(s.min)h+='<span class="pill">'+IC.clock+'Leitura de '+s.min+' min</span>';
  if(s.aula)h+='<span class="pill">'+IC.play+esc(s.aula)+'</span>';
  h+='</div></div><div class="ex-body">';
  if(s.naAula)h+='<div class="aula"><i>NA AULA</i>'+fmt(s.naAula)+'</div>';
  if(s.obj)h+='<div class="objective">'+IC.target+'<div><small>OBJETIVO</small><p>'+fmt(s.obj)+'</p></div></div>';
  if(s.case&&s.case.length){h+='<div class="case"><span class="tab">'+IC.folder+'CENÁRIO</span>'+(s.fict?'<span class="stamp">CASO FICTÍCIO</span>':'');
    s.case.forEach(b=>{h+=b.p!==undefined?'<p>'+fmt(b.p)+'</p>':'<div class="tbl">'+tableHtml(b.table)+'</div>'});h+='</div>'}
  if(s.body)h+='<div class="prose">'+blocks(s,s.body)+'</div>';
  if(s.qs&&s.qs.length){
    h+='<div class="qs-h" style="margin-top:'+(s.body?'30px':'0')+'"><h3>'+esc(s.qsLabel||'Perguntas')+'</h3><span id="qc"></span></div>';
    s.qs.forEach((q,qi)=>{const k=s.id+'.q'+qi,v=ANS[k];
      if(q.opts){h+='<div class="q quizq'+(v!==undefined?' filled':'')+'" data-k="'+k+'"><span class="num">'+(qi+1)+'</span><label>'+fmt(q.q)+'</label>'+q.opts.map((o,oi)=>'<button class="opt'+(v===oi?' sel':'')+'" data-o="'+oi+'"><span class="lt">'+'abcde'[oi]+'</span>'+fmt(o)+'</button>').join('')+'</div>'}
      else{const t=v||'';h+='<div class="q'+(String(t).trim()?' filled':'')+'" data-k="'+k+'"><span class="num">'+(qi+1)+'</span><label>'+fmt(q.q)+'</label>'+(q.table?'<div class="sub">'+tableHtml(q.table)+'</div>':'')+'<textarea placeholder="Escreva sua resposta aqui…" rows="3">'+esc(t)+'</textarea><div class="meta"><span class="sv">✓ salvo</span><span class="cc">'+String(t).length+' caracteres</span></div></div>'}});
  }
  if(s.fonte)h+='<div class="fonte">'+IC.book+'<div><b>Fonte</b> · '+fmt(s.fonte)+'</div></div>';
  const prev=i>0?SEC[i-1]:null,next=i<SEC.length-1?SEC[i+1]:null;
  h+='</div></div><div class="pager"><button class="pg-btn" data-go="'+(i-1)+'"><small>'+IC.left+(prev?'ANTERIOR · '+esc(prev.short):'MAPA')+'</small><b>'+(prev?esc(prev.title):'Mapa do material')+'</b></button>'+
   (next?'<button class="pg-btn next" data-go="'+(i+1)+'"><small>PRÓXIMO · '+esc(next.short)+IC.right+'</small><b>'+esc(next.title)+'</b></button>':'<button class="pg-btn next" data-go="-1"><small>CONCLUIR'+IC.right+'</small><b>Voltar ao mapa</b></button>')+'</div></div>';
  return h;
}
function count(){const s=SEC[cur];const el=document.getElementById('qc');if(el&&s.qs)el.textContent=s.qs.filter((q,i)=>filled(s.id+'.q'+i)).length+' de '+s.qs.length+' respondidas'}
function go(i,scroll=true){
  clearInterval(timer);timer=null;
  if(matchMedia('(max-width:980px)').matches)side.classList.add('closed');
  cur=i;main.innerHTML=i<0?home():section(i);
  main.querySelectorAll('textarea').forEach(grow);
  if(i>=0)count();progress();
  if(scroll){const y=document.querySelector('.wrap').getBoundingClientRect().top+scrollY-12;if(window.parentIFrame&&window.top!==window.self){try{parentIFrame.scrollToOffset(0,Math.max(0,y))}catch(e){}}else window.scrollTo({top:Math.max(0,y),behavior:'smooth'})}
  try{history.replaceState(null,'',i<0?'#mapa':'#'+SEC[i].id)}catch(e){}
}
function grow(t){t.style.height='auto';t.style.height=Math.max(84,t.scrollHeight)+'px'}
let saveT;
document.addEventListener('input',ev=>{
  const t=ev.target;if(t.tagName!=='TEXTAREA')return;
  const box=t.closest('[data-k]');ANS[box.dataset.k]=t.value;grow(t);box.classList.toggle('filled',!!t.value.trim());
  const cc=box.querySelector('.cc');if(cc)cc.textContent=t.value.length+' caracteres';
  clearTimeout(saveT);const sv=box.querySelector('.sv');if(sv)sv.classList.remove('show');
  saveT=setTimeout(()=>{save();if(sv)sv.classList.add('show');count();progress()},450);
});
document.addEventListener('click',ev=>{
  if(ev.target.closest('.side-h')){side.classList.toggle('closed');return}
  const g=ev.target.closest('[data-go]');if(g){go(+g.dataset.go);return}
  const c=ev.target.closest('[data-ck]');if(c){const k=c.dataset.ck;ANS[k]=!ANS[k];c.classList.toggle('on',ANS[k]);save();progress();return}
  const o=ev.target.closest('.opt');if(o){const box=o.closest('.q');box.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');box.classList.add('filled');ANS[box.dataset.k]=+o.dataset.o;save();count();progress();return}
  const tm=ev.target.closest('#tm');if(tm){
    if(timer){clearInterval(timer);timer=null;tm.classList.remove('run');return}
    if(remain<=0||tm.dataset.s!==SEC[cur].id){remain=SEC[cur].min*60;tm.dataset.s=SEC[cur].id}
    tm.classList.add('run');
    const tick=()=>{const sp=tm.querySelector('span');sp.textContent=(remain<=0?'Tempo esgotado':Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0'));if(remain<=0){clearInterval(timer);timer=null;tm.classList.remove('run');toast('Tempo da atividade encerrado')}remain--};
    tick();timer=setInterval(tick,1000);return}
});
cta.onclick=()=>{const n=SEC.findIndex(s=>done(s)<1);go(n<0?0:n)};
dl.onclick=()=>{
  let t='HSC Academy · '+DOC.eyebrow+'\n'+DOC.title+' · '+DOC.subtitle+'\nGerado em '+new Date().toLocaleString('pt-BR')+'\n\n';
  SEC.forEach(s=>{const parts=[];
    (s.body||[]).forEach((b,i)=>{if(b.note!==undefined){const v=ANS[s.id+'.n'+i];if(v&&v.trim())parts.push((b.note||'Anotações')+':\n'+v)}if(b.check)b.check.forEach((c,j)=>parts.push((ANS[s.id+'.c'+i+'.'+j]?'[x] ':'[ ] ')+c.replace(/\*\*|\[|\]\([^)]*\)/g,'')))});
    (s.qs||[]).forEach((q,i)=>{const v=ANS[s.id+'.q'+i];parts.push((i+1)+'. '+q.q.replace(/\*\*/g,'')+'\n'+(q.opts?(v!==undefined?'('+'abcde'[v]+') '+q.opts[v]:'(sem resposta)'):(v&&String(v).trim()?v:'(sem resposta)')))});
    if(parts.length)t+='━━━━━━━━━━━━━━━━━━━━━━━━\n'+s.short+' · '+s.title+'\n\n'+parts.join('\n\n')+'\n\n'});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain;charset=utf-8'}));a.download=DOC.code+'_meu-material.txt';a.click();toast('Arquivo baixado')};
function toast(m){const t=document.getElementById('toast');t.querySelector('span').textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
document.addEventListener('keydown',e=>{if(/TEXTAREA|INPUT/.test(e.target.tagName))return;if(e.key==='ArrowRight'&&cur<SEC.length-1)go(cur+1);if(e.key==='ArrowLeft'&&cur>-1)go(cur-1)});
const side=document.getElementById('side'),main=document.getElementById('main');
if(matchMedia('(max-width:980px)').matches)side.classList.add('closed');
const i0=SEC.findIndex(s=>s.id===location.hash.slice(1));
go(i0,false);
</script>
</body>
